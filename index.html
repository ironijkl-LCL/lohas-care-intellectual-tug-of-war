<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智力拉鋸戰 - Arcade Master Edition</title>
  <!-- Socket.io Client -->
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <!-- Google Fonts 霓虹科技感字體 -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans TC', sans-serif; user-select: none; }
    
    /* ===== 炫彩宇宙與動態網格背景 ===== */
    body {
      background: radial-gradient(circle at 50% 20%, #1a1c38 0%, #0d0e1e 60%, #05050d 100%);
      color: #fff; text-align: center; padding: 16px 12px; min-height: 100vh; overflow-x: hidden; position: relative;
    }

    body::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                  linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 32px 32px; pointer-events: none; z-index: 0;
    }

    .container { position: relative; z-index: 1; max-width: 820px; margin: 0 auto; }

    /* ===== 霓虹標題 ===== */
    h1 {
      font-family: 'Orbitron', 'Noto Sans TC', sans-serif; font-size: 34px; font-weight: 900;
      background: linear-gradient(180deg, #fff 20%, #f1c40f 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(241, 196, 15, 0.5); letter-spacing: 2px;
    }
    .subtitle {
      font-family: 'Orbitron', sans-serif; color: #00d2ff; font-size: 11px; letter-spacing: 4px;
      text-transform: uppercase; margin-bottom: 16px; text-shadow: 0 0 10px rgba(0, 210, 255, 0.6);
    }

    /* ===== 中央競技場 ===== */
    .arena {
      background: rgba(22, 27, 46, 0.85); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border-radius: 24px; padding: 20px; margin-bottom: 16px; box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08); position: relative;
    }

    /* 畫面震動效果 */
    .shake { animation: arenaShake 0.25s cubic-bezier(.36,.07,.19,.97) both; }
    @keyframes arenaShake {
      10%, 90% { transform: translate3d(-3px, 0, 0); }
      20%, 80% { transform: translate3d(4px, -2px, 0); }
      30%, 50%, 70% { transform: translate3d(-5px, 2px, 0); }
      40%, 60% { transform: translate3d(5px, 0, 0); }
    }

    /* 計分板 */
    .scoreboard {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;
      background: rgba(10, 14, 26, 0.7); padding: 12px 24px; border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .team-label { font-family: 'Orbitron', sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 1px; }
    .red-label { color: #ff4757; text-shadow: 0 0 10px rgba(255, 71, 87, 0.6); }
    .blue-label { color: #2ed573; text-shadow: 0 0 10px rgba(46, 213, 115, 0.6); }
    .team-score { font-family: 'Orbitron', sans-serif; font-size: 48px; font-weight: 900; line-height: 1; }
    .red-score { color: #ff6b81; text-shadow: 0 0 15px rgba(255, 107, 129, 0.6); }
    .blue-score { color: #7bed9f; text-shadow: 0 0 15px rgba(123, 237, 159, 0.6); }

    /* ===== 動態拔河舞台 ===== */
    .tow-stage {
      position: relative; height: 160px; background: #090c15; border-radius: 20px;
      overflow: hidden; border: 2px solid #1e2746; box-shadow: inset 0 0 25px rgba(0,0,0,0.9);
      display: flex; align-items: center; justify-content: center;
    }

    .stage-floor {
      position: absolute; bottom: 0; left: 0; right: 0; height: 42px;
      background: linear-gradient(180deg, #141b2d 0%, #080a14 100%); border-top: 2px solid #2f3640;
    }

    /* 動態車架 (隨比分平移) */
    .rope-assembly {
      position: absolute; top: 0; bottom: 0; width: 620px;
      left: 50%; transform: translateX(-50%); transition: left 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.25);
      display: flex; align-items: center; justify-content: center;
    }

    .rope-line {
      position: absolute; top: 62%; left: 70px; right: 70px; height: 14px;
      background: repeating-linear-gradient(45deg, #d2dae2, #d2dae2 8px, #808e9b 8px, #808e9b 16px);
      border-radius: 7px; box-shadow: 0 4px 8px rgba(0,0,0,0.6), inset 0 2px 2px rgba(255,255,255,0.6); z-index: 2;
    }

    /* 中央紅旗 */
    .center-flag {
      position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); z-index: 4;
      display: flex; flex-direction: column; align-items: center;
    }
    .flag-banner {
      width: 24px; height: 28px; background: #e74c3c;
      clip-path: polygon(0 0, 100% 0, 100% 70%, 50% 100%, 0 70%);
      box-shadow: 0 0 12px #e74c3c; animation: pulseFlag 0.8s infinite alternate;
    }
    @keyframes pulseFlag { from { transform: scale(1); } to { transform: scale(1.15); } }
    .flag-ring { width: 14px; height: 14px; background: #f1c40f; border-radius: 50%; border: 2px solid #fff; margin-top: -4px; }

    /* ===== 公仔團隊 ===== */
    .team-sprites { position: absolute; top: 25px; display: flex; gap: 6px; z-index: 3; }
    .sprites-red { right: 52%; flex-direction: row-reverse; }
    .sprites-blue { left: 52%; flex-direction: row; }

    .character { width: 44px; height: 62px; position: relative; transition: transform 0.15s; }
    .pulling-red { animation: pullRed 0.4s infinite alternate ease-in-out; }
    .pulling-blue { animation: pullBlue 0.4s infinite alternate ease-in-out; }
    
    @keyframes pullRed {
      from { transform: rotate(-8deg) translateX(0); }
      to { transform: rotate(-18deg) translateX(-4px); }
    }
    @keyframes pullBlue {
      from { transform: rotate(8deg) translateX(0); }
      to { transform: rotate(18deg) translateX(4px); }
    }

    /* Fever 狂暴狀態 */
    .fever-mode .character { filter: drop-shadow(0 0 10px #f1c40f); animation-duration: 0.2s !important; }

    /* 浮動傷害/得分文字 */
    .float-text {
      position: absolute; font-family: 'Orbitron', sans-serif; font-size: 24px; font-weight: 900;
      pointer-events: none; z-index: 20; animation: floatUp 0.8s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
    }
    @keyframes floatUp {
      0% { opacity: 1; transform: translate(-50%, 0) scale(0.5); }
      50% { transform: translate(-50%, -25px) scale(1.2); }
      100% { opacity: 0; transform: translate(-50%, -45px) scale(1); }
    }

    /* 分差條 */
    .diff-bar-wrap { margin-top: 14px; }
    .diff-bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: #090c15; }
    .diff-red-fill { background: linear-gradient(90deg, #ff4757, #ff6b81); transition: width 0.3s; }
    .diff-blue-fill { background: linear-gradient(90deg, #7bed9f, #2ed573); transition: width 0.3s; }

    .game-status { margin-top: 12px; font-size: 14px; font-weight: 700; color: #a4b0be; min-height: 20px; }

    /* 控制按鈕 */
    .btn-start {
      background: linear-gradient(135deg, #00b894, #00cec9); color: #fff; padding: 12px 24px;
      border-radius: 12px; border: none; cursor: pointer; font-size: 14px; font-weight: 700;
      margin-top: 12px; transition: all 0.2s; box-shadow: 0 4px 15px rgba(0, 206, 201, 0.4);
    }
    .btn-start:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0, 206, 201, 0.6); }

    /* 陣營選擇 */
    .team-select { margin: 24px 0; }
    .btn-team {
      padding: 16px 36px; font-size: 17px; font-weight: 900; border: none; border-radius: 16px;
      cursor: pointer; margin: 0 10px; color: #fff; transition: all 0.2s;
    }
    .btn-red { background: linear-gradient(135deg, #ff4757, #ff6b81); box-shadow: 0 6px 20px rgba(255, 71, 87, 0.4); }
    .btn-blue { background: linear-gradient(135deg, #2ed573, #10ac84); box-shadow: 0 6px 20px rgba(46, 213, 115, 0.4); }

    /* ===== 答題卡區 ===== */
    .quiz-card {
      background: rgba(15, 20, 35, 0.9); backdrop-filter: blur(20px); border-radius: 20px;
      padding: 24px 20px; margin: 16px auto; max-width: 440px; display: none;
      border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
      position: relative; overflow: hidden;
    }
    
    /* ===== NEW: 計時器進度條樣式 ===== */
    .timer-container {
      display: flex; align-items: center; gap: 10px; margin-bottom: 12px;
    }
    .timer-text {
      font-family: 'Orbitron', sans-serif; font-size: 16px; font-weight: 900; color: #00d2ff;
      min-width: 42px; text-align: left;
    }
    .timer-bar {
      flex: 1; height: 10px; background: rgba(255, 255, 255, 0.1); border-radius: 5px;
      overflow: hidden; border: 1px solid rgba(0, 210, 255, 0.3);
    }
    .timer-fill {
      height: 100%; width: 100%;
      background: linear-gradient(90deg, #00d2ff, #00b894);
      transition: width 0.1s linear, background 0.3s;
    }
    /* 緊急倒數 (少於 3 秒) 的閃爍樣式 */
    .timer-warning .timer-fill {
      background: linear-gradient(90deg, #ff4757, #ff6b81);
    }
    .timer-warning .timer-text {
      color: #ff4757; animation: blinkText 0.5s infinite alternate;
    }
    @keyframes blinkText { from { opacity: 1; } to { opacity: 0.3; } }

    /* Combo 指示標籤 */
    .combo-badge {
      position: absolute; top: 12px; right: 20px; background: linear-gradient(135deg, #f1c40f, #e67e22);
      color: #000; font-family: 'Orbitron', sans-serif; font-size: 12px; font-weight: 900;
      padding: 4px 12px; border-radius: 12px; box-shadow: 0 0 10px rgba(241, 196, 15, 0.8);
      display: none; z-index: 5;
    }

    .question { font-family: 'Orbitron', 'Noto Sans TC', sans-serif; font-size: 32px; font-weight: 900; margin-bottom: 20px; color: #00d2ff; }
    .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .btn-option {
      background: rgba(255, 255, 255, 0.05); color: #fff; border: 2px solid rgba(0, 210, 255, 0.3);
      padding: 18px 10px; font-family: 'Orbitron', sans-serif; font-size: 22px; font-weight: 700;
      border-radius: 14px; cursor: pointer; transition: all 0.15s;
    }
    .btn-option:hover { background: rgba(0, 210, 255, 0.25); border-color: #00d2ff; }
    .frozen { opacity: 0.3; pointer-events: none; filter: grayscale(1); }
  </style>
</head>
<body>

  <div class="container">
    <h1>智力拉鋸戰</h1>
    <p class="subtitle">Arcade Tug-of-War Showdown</p>

    <!-- ===== 中央拔河競技場 ===== -->
    <div class="arena" id="arena-box">
      <div class="scoreboard">
        <div>
          <div class="team-label red-label">紅隊 RED</div>
          <div class="team-score red-score" id="red-score">0</div>
        </div>
        <div style="font-family:'Orbitron'; font-size:16px; color:#57606f;">VS</div>
        <div>
          <div class="team-label blue-label">綠隊 GREEN</div>
          <div class="team-score blue-score" id="blue-score">0</div>
        </div>
      </div>

      <!-- 動態拔河舞台 -->
      <div class="tow-stage">
        <div class="stage-floor"></div>

        <div class="rope-assembly" id="rope-assembly">
          <div class="rope-line"></div>
          <div class="center-flag">
            <div class="flag-banner"></div>
            <div class="flag-ring"></div>
          </div>

          <!-- 紅隊 4 位公仔 -->
          <div class="team-sprites sprites-red" id="sprites-red">
            <div class="character pulling-red"><svg viewBox="0 0 64 80"><circle cx="32" cy="18" r="14" fill="#ff6b81"/><path d="M16 36 Q32 32 48 36 L44 60 L20 60 Z" fill="#ff4757"/><circle cx="26" cy="16" r="2" fill="#fff"/><circle cx="36" cy="16" r="2" fill="#fff"/></svg></div>
            <div class="character pulling-red"><svg viewBox="0 0 64 80"><circle cx="32" cy="18" r="14" fill="#ff6b81"/><path d="M16 36 Q32 32 48 36 L44 60 L20 60 Z" fill="#ff4757"/><circle cx="26" cy="16" r="2" fill="#fff"/><circle cx="36" cy="16" r="2" fill="#fff"/></svg></div>
            <div class="character pulling-red"><svg viewBox="0 0 64 80"><circle cx="32" cy="18" r="14" fill="#ff6b81"/><path d="M16 36 Q32 32 48 36 L44 60 L20 60 Z" fill="#ff4757"/><circle cx="26" cy="16" r="2" fill="#fff"/><circle cx="36" cy="16" r="2" fill="#fff"/></svg></div>
            <div class="character pulling-red"><svg viewBox="0 0 64 80"><circle cx="32" cy="18" r="14" fill="#ff6b81"/><path d="M16 36 Q32 32 48 36 L44 60 L20 60 Z" fill="#ff4757"/><circle cx="26" cy="16" r="2" fill="#fff"/><circle cx="36" cy="16" r="2" fill="#fff"/></svg></div>
          </div>

          <!-- 綠隊 4 位公仔 -->
          <div class="team-sprites sprites-blue" id="sprites-blue">
            <div class="character pulling-blue"><svg viewBox="0 0 64 80"><circle cx="32" cy="18" r="14" fill="#7bed9f"/><path d="M16 36 Q32 32 48 36 L44 60 L20 60 Z" fill="#2ed573"/><circle cx="28" cy="16" r="2" fill="#fff"/><circle cx="38" cy="16" r="2" fill="#fff"/></svg></div>
            <div class="character pulling-blue"><svg viewBox="0 0 64 80"><circle cx="32" cy="18" r="14" fill="#7bed9f"/><path d="M16 36 Q32 32 48 36 L44 60 L20 60 Z" fill="#2ed573"/><circle cx="28" cy="16" r="2" fill="#fff"/><circle cx="38" cy="16" r="2" fill="#fff"/></svg></div>
            <div class="character pulling-blue"><svg viewBox="0 0 64 80"><circle cx="32" cy="18" r="14" fill="#7bed9f"/><path d="M16 36 Q32 32 48 36 L44 60 L20 60 Z" fill="#2ed573"/><circle cx="28" cy="16" r="2" fill="#fff"/><circle cx="38" cy="16" r="2" fill="#fff"/></svg></div>
            <div class="character pulling-blue"><svg viewBox="0 0 64 80"><circle cx="32" cy="18" r="14" fill="#7bed9f"/><path d="M16 36 Q32 32 48 36 L44 60 L20 60 Z" fill="#2ed573"/><circle cx="28" cy="16" r="2" fill="#fff"/><circle cx="38" cy="16" r="2" fill="#fff"/></svg></div>
          </div>
        </div>
      </div>

      <div class="diff-bar-wrap">
        <div class="diff-bar">
          <div class="diff-red-fill" id="diff-red" style="width:50%"></div>
          <div class="diff-blue-fill" id="diff-blue" style="width:50%"></div>
        </div>
      </div>

      <div class="game-status" id="game-status">點擊下方按鈕啟動 100 題對戰！</div>

      <button class="btn-start" onclick="startGame()">🎲 重新載入 100 題新題目</button>
    </div>

    <!-- 選擇隊伍區 -->
    <div id="team-select-section" class="team-select">
      <h3 style="margin-bottom:16px;">選擇你的陣營加入拉鋸戰：</h3>
      <button class="btn-team btn-red" onclick="joinTeam('red')">加入紅隊</button>
      <button class="btn-team btn-blue" onclick="joinTeam('blue')">加入綠隊</button>
    </div>

    <!-- 答題卡區 -->
    <div id="quiz-card" class="quiz-card">
      <div id="combo-badge" class="combo-badge">COMBO x<span id="combo-count">0</span></div>
      
      <!-- NEW: 倒數計時器元件 -->
      <div id="timer-container" class="timer-container">
        <div id="timer-text" class="timer-text">15.0s</div>
        <div class="timer-bar">
          <div id="timer-fill" class="timer-fill"></div>
        </div>
      </div>

      <div id="question" class="question">等待發題...</div>
      <div id="options-grid" class="options-grid"></div>
    </div>
  </div>

  <script>
    const RENDER_BACKEND_URL = 'https://lohas-care-intellectual-tug-of-war.onrender.com';
    const socket = io(RENDER_BACKEND_URL);

    // 音效 Web Audio API 合成器
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);

      if (type === 'correct') {
        osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
        osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.15); // A5
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
        osc.start(); osc.stop(audioCtx.currentTime + 0.15);
      } else if (type === 'wrong') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(180, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(110, audioCtx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
        osc.start(); osc.stop(audioCtx.currentTime + 0.2);
      } else if (type === 'warning') {
        // NEW: 倒數警告音
        osc.type = 'square';
        osc.frequency.setValueAtTime(440, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
        osc.start(); osc.stop(audioCtx.currentTime + 0.08);
      }
    }

    let currentTeam = null;
    let questions = [];
    let currentQuestionIndex = 0;
    let questionStartTime = 0;
    let lastRedScore = 0;
    let lastBlueScore = 0;
    let comboCount = 0;

    // NEW: 計時器全域變數
    const QUESTION_TIMEOUT_SEC = 15;
    let timerInterval = null;
    let timeLeft = QUESTION_TIMEOUT_SEC;

    const redScoreEl = document.getElementById('red-score');
    const blueScoreEl = document.getElementById('blue-score');
    const ropeAssembly = document.getElementById('rope-assembly');
    const arenaBox = document.getElementById('arena-box');
    const diffRed = document.getElementById('diff-red');
    const diffBlue = document.getElementById('diff-blue');
    const statusEl = document.getElementById('game-status');
    const comboBadge = document.getElementById('combo-badge');
    const comboCountEl = document.getElementById('combo-count');

    // NEW: 計時器 DOM 元素
    const timerContainer = document.getElementById('timer-container');
    const timerTextEl = document.getElementById('timer-text');
    const timerFillEl = document.getElementById('timer-fill');

    socket.on('connect', () => { console.log('已成功連線至後端引擎'); });

    socket.on('game_update', (state) => { updateArena(state.redScore, state.blueScore); });

    socket.on('game_init', (state) => {
      questions = state.questions;
      currentQuestionIndex = 0;
      comboCount = 0;
      updateComboUI();
      updateArena(state.redScore, state.blueScore);
      if (currentTeam) showNextQuestion();
    });

    socket.on('game_over', (data) => {
      stopTimer();
      const winner = data.winner === 'red' ? '紅隊' : '綠隊';
      statusEl.innerHTML = `<strong style="color:#f1c40f; font-size:18px;">🎉 最終勝利歸於 ${winner}！</strong>`;
    });

    function updateArena(redScore, blueScore) {
      if (redScore > lastRedScore) showFloatingText('red', `+${redScore - lastRedScore}`);
      if (blueScore > lastBlueScore) showFloatingText('blue', `+${blueScore - lastBlueScore}`);
      
      if (redScore !== lastRedScore || blueScore !== lastBlueScore) {
        arenaBox.classList.add('shake');
        setTimeout(() => arenaBox.classList.remove('shake'), 250);
      }

      lastRedScore = redScore;
      lastBlueScore = blueScore;

      redScoreEl.textContent = redScore;
      blueScoreEl.textContent = blueScore;

      const diff = redScore - blueScore;
      const total = redScore + blueScore || 1;
      
      const maxDiff = Math.max(Math.abs(diff), 60);
      const shiftPercent = (diff / maxDiff) * 22;
      ropeAssembly.style.left = (50 + shiftPercent) + '%';

      const redW = (redScore / total) * 100;
      diffRed.style.width = redW + '%';
      diffBlue.style.width = (100 - redW) + '%';

      if (diff > 15) statusEl.innerHTML = `<strong style="color:#ff4757">紅隊正在強力拉扯！</strong> 領先 ${diff} 分`;
      else if (diff < -15) statusEl.innerHTML = `<strong style="color:#2ed573">綠隊發動猛烈反撲！</strong> 領先 ${Math.abs(diff)} 分`;
      else statusEl.innerHTML = `雙方緊繃拉鋸中！`;
    }

    function showFloatingText(team, text) {
      const el = document.createElement('div');
      el.className = 'float-text';
      el.innerText = text;
      el.style.color = team === 'red' ? '#ff4757' : '#2ed573';
      el.style.left = team === 'red' ? '35%' : '65%';
      el.style.top = '40%';
      document.querySelector('.tow-stage').appendChild(el);
      setTimeout(() => el.remove(), 800);
    }

    function joinTeam(team) {
      currentTeam = team;
      socket.emit('join_team', team);
      document.getElementById('team-select-section').style.display = 'none';
      document.getElementById('quiz-card').style.display = 'block';
      if (questions.length > 0) showNextQuestion();
    }

    function startGame() {
      fetch(`${RENDER_BACKEND_URL}/api/start-game`)
        .then(res => res.json())
        .then(data => console.log('遊戲已發起重置'));
    }

    function updateComboUI() {
      if (comboCount >= 2) {
        comboBadge.style.display = 'block';
        comboCountEl.innerText = comboCount;
      } else {
        comboBadge.style.display = 'none';
      }
    }

    // NEW: 啟動倒數計時器
    function startTimer() {
      stopTimer();
      timeLeft = QUESTION_TIMEOUT_SEC;
      timerContainer.classList.remove('timer-warning');
      updateTimerUI();

      let lastSec = Math.ceil(timeLeft);

      timerInterval = setInterval(() => {
        timeLeft -= 0.1;

        // 當秒數跳變且小於等於 3 秒時，播放警示音
        const currentSec = Math.ceil(timeLeft);
        if (currentSec <= 3 && currentSec !== lastSec && currentSec > 0) {
          playSound('warning');
          lastSec = currentSec;
        }

        if (timeLeft <= 3) {
          timerContainer.classList.add('timer-warning');
        }

        if (timeLeft <= 0) {
          stopTimer();
          handleTimeout(); // 時間到處理
        } else {
          updateTimerUI();
        }
      }, 100);
    }

    // NEW: 停止計時器
    function stopTimer() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
    }

    // NEW: 更新計時器 UI (數字與進度條)
    function updateTimerUI() {
      const displaySec = Math.max(0, timeLeft).toFixed(1);
      timerTextEl.innerText = `${displaySec}s`;
      const fillPercent = (Math.max(0, timeLeft) / QUESTION_TIMEOUT_SEC) * 100;
      timerFillEl.style.width = `${fillPercent}%`;
    }

    // NEW: 超時自動判定答錯處理
    function handleTimeout() {
      submitAnswer(null, null, true); // 第三個參數 isTimeout = true
    }

    function showNextQuestion() {
      if (currentQuestionIndex >= questions.length) {
        stopTimer();
        document.getElementById('question').innerText = "100 題已全數完成！";
        document.getElementById('options-grid').innerHTML = "";
        timerContainer.style.display = 'none';
        return;
      }

      const q = questions[currentQuestionIndex];
      document.getElementById('question').innerText = q.question;
      questionStartTime = Date.now();

      const optionsGrid = document.getElementById('options-grid');
      optionsGrid.innerHTML = '';
      q.options.forEach(option => {
        const btn = document.createElement('button');
        btn.className = 'btn-option';
        btn.innerText = option;
        btn.onclick = () => submitAnswer(option, q.answer);
        optionsGrid.appendChild(btn);
      });

      // 每題啟動 15 秒計時
      startTimer();
    }

    function submitAnswer(selected, correct, isTimeout = false) {
      stopTimer(); // 玩家回答或超時均先停掉計時器

      const isCorrect = !isTimeout && (selected === correct);
      const responseTimeSec = (Date.now() - questionStartTime) / 1000;
      
      socket.emit('submit_answer', { isCorrect, responseTimeSec });

      if (isCorrect) {
        playSound('correct');
        comboCount++;
        updateComboUI();
        currentQuestionIndex++;
        showNextQuestion();
      } else {
        playSound('wrong');
        comboCount = 0;
        updateComboUI();

        const quizCard = document.getElementById('quiz-card');
        quizCard.classList.add('frozen');

        // 懲罰凍結 1.5 秒後自動跳下一題（若是超時也會自動跳題）
        setTimeout(() => {
          quizCard.classList.remove('frozen');
          currentQuestionIndex++;
          showNextQuestion();
        }, 1500);
      }
    }
  </script>
</body>
</html>
